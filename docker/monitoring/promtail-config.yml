# Promtail config — DEVOPS-06. Ships every container's stdout/stderr logs
# (Docker's default json-file log driver output) to Loki, tagging each
# stream with the container name so Grafana/Loki queries can filter by
# service (e.g. `{container="fastapi-backend"}`). Standard Docker-log
# scrape pattern for grafana/promtail's official image — not a custom
# pipeline, since nothing in this project currently needs structured log
# parsing beyond "which service, what line, when."
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Label each log line with the container's compose service name
      # (com.docker.compose.service) rather than Docker's generated
      # container ID/name, so `{container="fastapi-backend"}` reads the
      # same way whether or not the stack was ever restarted.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: container
      - source_labels: ["__meta_docker_container_name"]
        target_label: container_name
